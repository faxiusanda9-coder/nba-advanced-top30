<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA 高阶数据 TOP 30</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1017;color:#edf2f8;font:15px Arial,"Microsoft YaHei",sans-serif}
main{max-width:1200px;margin:auto;padding:32px 18px}h1{margin:0 0 8px;font-size:36px}p,.note{color:#9aa9bb}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#151d28;padding:16px;border-radius:12px;margin:24px 0}
select,button{background:#0d141d;color:#eef;border:1px solid #344255;border-radius:7px;padding:10px 12px;font-size:14px}
button{cursor:pointer;color:#a5f0c5}#status{min-height:24px;color:#a5f0c5;margin:14px 0}
.box{overflow:auto;border:1px solid #273342;border-radius:10px;background:#111923}
table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:12px 10px;border-bottom:1px solid #273342;text-align:right;white-space:nowrap}
th{color:#aab8c8;background:#17212d;position:sticky;top:0}td:nth-child(2),td:nth-child(3),th:nth-child(2),th:nth-child(3){text-align:left}
tr:hover td{background:#192432}.rank{color:#f47b48}.metric{color:#a5f0c5;font-weight:bold}
.player-cell{display:flex;align-items:center;gap:10px;text-align:left!important}
.portrait{position:relative;display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;background:#263547;color:#a5f0c5;font-size:12px;font-weight:bold}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
footer{font-size:12px;color:#8290a2;margin-top:18px}a{color:#a5f0c5}
@media(max-width:600px){main{padding:22px 12px}h1{font-size:29px}}
</style>
</head>
<body>
<main>
  <h1>NBA 高阶数据 TOP 30</h1>
  <p>按球员高阶统计指标查看联盟排名。</p>

  <section class="controls">
    <label>赛季
      <select id="season"></select>
    </label>
    <label>赛制
      <select id="type">
        <option value="REG">常规赛</option><option value="PST">季后赛</option>
      </select>
    </label>
    <label>排名指标
      <select id="metric">
        <option value="NET_RATING">NET RTG 净效率</option>
        <option value="OFF_RATING">OFF RTG 进攻效率</option>
        <option value="PIE">PIE 球员影响效率</option>
        <option value="EFG_PCT">eFG% 有效命中率</option>
        <option value="TS_PCT">TS% 真实命中率</option>
        <option value="USG_PCT">USG% 使用率</option>
        <option value="E_USG_PCT">E-USG% 预估使用率</option>
        <option value="AST_TO">AST/TO 助攻失误比</option>
        <option value="AST_RATIO">AST Ratio 助攻比</option>
        <option value="OREB_PCT">OREB% 前场篮板率</option>
        <option value="DREB_PCT">DREB% 后场篮板率</option>
        <option value="REB_PCT">REB% 篮板率</option>
        <option value="AST_PCT">AST% 助攻率</option>
        <option value="E_TOV_PCT">E-TOV% 预估失误率（越低越好）</option>
        <option value="PACE">PACE 回合节奏</option>
        <option value="POSS">POSS 球员回合数</option>
      </select>
    </label>
    <label>最低场均出场时间
      <select id="minMinutes">
        <option value="20" selected>20 分钟</option>
        <option value="25">25 分钟</option>
        <option value="30">30 分钟</option>
      </select>
    </label>
    <button id="refresh">刷新数据</button>
  </section>

  <div id="status">正在读取历史数据档案…</div>
  <div class="box">
    <table>
      <thead><tr>
        <th>排名</th><th>球员</th><th>球队</th><th>出场</th><th>场均分钟</th>
        <th>OFF RTG</th><th>DEF RTG</th><th>NET RTG</th><th>eFG%</th><th>TS%</th>
        <th>USG%</th><th>E-USG%</th><th>AST/TO</th><th>AST Ratio</th><th>OREB%</th>
        <th>DREB%</th><th>REB%</th><th>AST%</th><th>E-TOV%</th><th>PACE</th><th>POSS</th><th>PIE</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="22">正在加载…</td></tr></tbody>
    </table>
  </div>

  <footer>
    数据为按赛季保存的 NBA Stats 历史档案；高级指标从 1996-97 赛季开始。<br>
    指标说明：包括进攻/防守/净效率、有效/真实命中率、使用率、助攻与失误、前后场篮板率、回合节奏、球员回合数和 PIE。PER、WS、VORP、BPM 属于其他统计口径，不在本档案内。
  </footer>
</main>
<script>
const $ = id => document.getElementById(id);
let allRows = [];
const seasonSelect = $('season');
for (let year = 2025; year >= 1996; year--) {
  const label = `${year}-${String((year + 1) % 100).padStart(2, '0')}`;
  seasonSelect.add(
    new Option(label, label, year === 2025, year === 2025)
  );
}
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[c]);
}
function showRows() {
  const key = $('metric').value;
  const minMinutes = Number($('minMinutes').value);
  const isRegularSeason = $('type').value === 'REG';
  const minGames = isRegularSeason ? 58 : 7;
  const eligibleRows = allRows
    .filter(r => {
      const games = Number(r.GP);
      const minutesPerGame = Number(r.MIN);
      return r.PLAYER_NAME && r[key] != null && Number.isFinite(Number(r[key])) &&
        Number.isFinite(games) && games >= minGames && Number.isFinite(minutesPerGame) &&
        minutesPerGame >= minMinutes;
    });
  const lowerIsBetter = key === 'E_TOV_PCT';
  const rows = eligibleRows
    .sort((a,b) => lowerIsBetter ? Number(a[key]) - Number(b[key]) : Number(b[key]) - Number(a[key]))
    .slice(0,30);

  const seasonType = isRegularSeason ? '常规赛' : '季后赛';
  const season = $('season').value;
  $('status').textContent = `已载入 ${season} ${seasonType}档案，共 ${allRows.length} 条球员记录；筛选条件：场均至少 ${minMinutes} 分钟、至少出场 ${minGames} 场；符合条件 ${eligibleRows.length} 人，显示按所选指标排序的前 30 名`;

  $('rows').innerHTML = rows.map((r,i) => {
    const val = (field, pct=false) => {
      const n = Number(r[field]);
      if (r[field] == null || !Number.isFinite(n)) return '—';
      return n.toFixed(1) + (pct ? '%' : '');
    };
    const pie = Number(r.PIE);
    const initials = escapeHtml(String(r.PLAYER_NAME).trim().split(/\s+/).map(part => part[0] || '').slice(-2).join('').toUpperCase());
    const playerId = String(r.playerId ?? '').replace(/\D/g, '');
    const headshot = playerId
      ? `<img src="https://cdn.nba.com/headshots/nba/latest/260x190/${playerId}.png" alt="" loading="lazy" onerror="this.remove()">`
      : '';
    return `<tr>
      <td class="rank">${i+1}</td>
      <td class="player-cell"><span class="portrait"><span>${initials}</span>${headshot}</span>${escapeHtml(r.PLAYER_NAME)}</td>
      <td>${escapeHtml(r.TEAM_ABBREVIATION)}</td>
      <td>${val('GP')}</td><td>${val('MIN')}</td>
      <td>${val('OFF_RATING')}</td><td>${val('DEF_RATING')}</td>
      <td class="metric">${val('NET_RATING')}</td><td>${val('EFG_PCT',true)}</td>
      <td>${val('TS_PCT',true)}</td><td>${val('USG_PCT',true)}</td><td>${val('E_USG_PCT',true)}</td>
      <td>${val('AST_TO')}</td><td>${val('AST_RATIO')}</td><td>${val('OREB_PCT',true)}</td>
      <td>${val('DREB_PCT',true)}</td><td>${val('REB_PCT',true)}</td><td>${val('AST_PCT',true)}</td>
      <td>${val('E_TOV_PCT',true)}</td><td>${val('PACE')}</td><td>${val('POSS')}</td>
      <td>${Number.isFinite(pie) ? pie.toFixed(3) : '—'}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="22">没有符合筛选条件的球员</td></tr>';
}
async function load() {
  $('status').textContent = '正在读取该赛季的历史档案…';
    $('rows').innerHTML = '<tr><td colspan="22">正在加载…</td></tr>';
  try {
    const startingYear = Number($('season').value.slice(0, 4));
    const endingYear = startingYear + 1;
    const response = await fetch(`/data/${endingYear}.json`, {signal:AbortSignal.timeout(30000)});
    const body = await response.json();
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    allRows = body.rows?.[$('type').value] || [];
    if (!allRows.length) throw new Error('接口没有返回球员数据');
    $('status').textContent = `已载入 ${body.season} ${$('type').value === 'REG' ? '常规赛' : '季后赛'}档案，共 ${allRows.length} 条球员记录；榜单按所选指标排序`;
    showRows();
  } catch (error) {
    allRows = [];
    $('status').textContent = `加载失败：${error.message}`;
    $('rows').innerHTML = '<tr><td colspan="22">该赛季档案尚未部署。请稍后刷新，或检查 GitHub Actions 是否已完成历史回填。</td></tr>';
  }
}
$('refresh').addEventListener('click',load);
$('metric').addEventListener('change',showRows);
$('minMinutes').addEventListener('change',showRows);
$('season').addEventListener('change',load);
$('type').addEventListener('change',load);
load();
</script>
</body>
</html>
