name: Update NBA season archive

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'sources/**'
  workflow_dispatch:
    inputs:
      backfill:
        description: Download all seasons from 1996-97 through the current season
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '30 8 * * 1'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and normalize NBA Stats archive
        run: |
          if [ "${{ github.event_name }}" = "push" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backfill }}" = "true" ]; }; then
            node scripts/build-data.mjs --backfill
          else
            node scripts/build-data.mjs
          fi
      - name: Merge FiveThirtyEight and Estimated RAPTOR ratings
        run: node scripts/add-raptor.mjs
      - name: Merge 2025-26 LAKER successor ratings from public leaderboards or saved snapshots
        run: node scripts/add-laker.mjs --refresh
      - name: Merge Basketball Reference regular-season advanced metrics
        run: node scripts/add-bbref.mjs
      - name: Merge Basketball Reference playoff advanced metrics through 2021-22
        run: node scripts/add-bbref-playoffs.mjs
      - name: Merge recent Basketball Reference playoff metrics from public API or saved snapshots
        run: node scripts/add-bbref-recent-playoffs.mjs --refresh
      - name: Commit updated season files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json sources/bbref-playoffs/*.json sources/laker/*.json
          if git diff --cached --quiet; then
            echo "No season data changes."
          else
            git commit -m "Update NBA season data archive"
            git push
          fi
