<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA 高阶数据 TOP 30</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1017;color:#edf2f8;font:15px Arial,"Microsoft YaHei",sans-serif}
main{max-width:1200px;margin:auto;padding:32px 18px}h1{margin:0 0 8px;font-size:36px}p,.note{color:#9aa9bb}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#151d28;padding:16px;border-radius:12px;margin:24px 0}
select,button{background:#0d141d;color:#eef;border:1px solid #344255;border-radius:7px;padding:10px 12px;font-size:14px}
button{cursor:pointer;color:#a5f0c5}#status{min-height:24px;color:#a5f0c5;margin:14px 0}
.box{overflow:auto;border:1px solid #273342;border-radius:10px;background:#111923}
table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:12px 10px;border-bottom:1px solid #273342;text-align:right;white-space:nowrap}
th{color:#aab8c8;background:#17212d;position:sticky;top:0}td:nth-child(2),td:nth-child(3),th:nth-child(2),th:nth-child(3){text-align:left}
tr:hover td{background:#192432}.rank{color:#f47b48}.metric{color:#a5f0c5;font-weight:bold}
footer{font-size:12px;color:#8290a2;margin-top:18px}a{color:#a5f0c5}
@media(max-width:600px){main{padding:22px 12px}h1{font-size:29px}}
</style>
</head>
<body>
<main>
  <h1>NBA 高阶数据 TOP 30</h1>
  <p>按球员高阶统计指标查看联盟排名。</p>

  <section class="controls">
    <label>赛季
      <select id="season">
        <option>2025-26</option><option>2024-25</option><option>2023-24</option>
        <option>2022-23</option><option>2021-22</option><option>2020-21</option>
      </select>
    </label>
    <label>赛制
      <select id="type">
        <option value="REG">常规赛</option><option value="PST">季后赛</option>
      </select>
    </label>
    <label>排名指标
      <select id="metric">
        <option value="PER">PER 球员效率值</option>
        <option value="WS">WS 胜利贡献值</option>
        <option value="VORP">VORP 替代球员贡献值</option>
        <option value="TS_PCT">TS% 真实命中率</option>
        <option value="USG_PCT">Usage% 使用率</option>
        <option value="OBPM">OBPM 进攻正负值</option>
        <option value="DBPM">DBPM 防守正负值</option>
      </select>
    </label>
    <button id="refresh">刷新数据</button>
  </section>

  <div id="status">正在连接数据接口…</div>
  <div class="box">
    <table>
      <thead><tr>
        <th>排名</th><th>球员</th><th>球队</th><th>出场</th><th>分钟</th>
        <th>PER</th><th>TS%</th><th>Usage%</th><th>REB%</th><th>AST%</th>
        <th>WS</th><th>VORP</th><th>OBPM</th><th>DBPM</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="14">正在加载…</td></tr></tbody>
    </table>
  </div>

  <footer>
    数据来自 <a href="https://github.com/ehammill/nbastats">社区 NBA Stats API</a>，不是 NBA 官方服务。
  </footer>
</main>
<script>
const $ = id => document.getElementById(id);
let allRows = [];

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[c]);
}
function showRows() {
  const key = $('metric').value;
  const rows = allRows
    .filter(r => r.PLAYER_NAME && Number.isFinite(Number(r[key])))
    .sort((a,b) => Number(b[key]) - Number(a[key]))
    .slice(0,30);

  $('rows').innerHTML = rows.map((r,i) => {
    const val = (field, pct=false) => {
      const n = Number(r[field]);
      if (r[field] == null || !Number.isFinite(n)) return '—';
      return (field === 'TS_PCT' ? (n*100).toFixed(1) : n.toFixed(1)) + (pct ? '%' : '');
    };
    return `<tr>
      <td class="rank">${i+1}</td>
      <td>${escapeHtml(r.PLAYER_NAME)}</td><td>${escapeHtml(r.TEAM_ABBREVIATION)}</td>
      <td>${val('GP')}</td><td>${val('MIN')}</td>
      <td class="metric">${val('PER')}</td><td>${val('TS_PCT',true)}</td>
      <td>${val('USG_PCT',true)}</td><td>${val('REB_PCT',true)}</td>
      <td>${val('AST_PCT',true)}</td><td>${val('WS')}</td><td>${val('VORP')}</td>
      <td>${val('OBPM')}</td><td>${val('DBPM')}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="14">没有可显示的数据</td></tr>';
}
async function load() {
  $('status').textContent = '正在加载球员数据…';
  $('rows').innerHTML = '<tr><td colspan="14">正在加载…</td></tr>';
  try {
    const query = new URLSearchParams({season:$('season').value,type:$('type').value});
    const response = await fetch(`/api/advanced?${query}`, {signal:AbortSignal.timeout(30000)});
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || body.error || `HTTP ${response.status}`);
    allRows = body.rows || [];
    if (!allRows.length) throw new Error('接口没有返回球员数据');
    $('status').textContent = `已载入 ${allRows.length} 位球员；榜单按所选指标排序`;
    showRows();
  } catch (error) {
    allRows = [];
    $('status').textContent = `加载失败：${error.message}`;
    $('rows').innerHTML = '<tr><td colspan="14">请稍后点“刷新数据”重试。</td></tr>';
  }
}
$('refresh').addEventListener('click',load);
$('metric').addEventListener('change',showRows);
$('season').addEventListener('change',load);
$('type').addEventListener('change',load);
load();
</script>
</body>
</html>
